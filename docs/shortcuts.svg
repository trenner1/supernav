<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11142a"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48b0f7"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd6a7"/>
      <stop offset="1" stop-color="#1c8fd6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f5a"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffffff"/>
    </marker>
    <g id="key">
      <rect width="44" height="40" rx="9" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3"/>
    </g>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>

  <g transform="translate(40 32)">
    <rect width="356" height="336" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="178" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Stacked monitors</text>
    <rect x="113" y="62" width="130" height="76" rx="10" fill="url(#blue)"/>
    <rect x="113" y="176" width="130" height="76" rx="10" fill="url(#green)"/>
    <path d="M178 146 V 172" stroke="#ffffff" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <g transform="translate(72 268)" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">
      <use href="#key"/><text x="22" y="26">⌃</text>
      <use href="#key" x="52"/><text x="74" y="26">↑</text>
      <text x="118" y="26" font-weight="400" fill-opacity="0.6">or</text>
      <use href="#key" x="140"/><text x="162" y="26">↓</text>
    </g>
    <text x="178" y="328" text-anchor="middle" font-size="14" fill="#c9d3ff" fill-opacity="0.7">left Control</text>
  </g>

  <g transform="translate(422 32)">
    <rect width="356" height="336" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="178" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Side-by-side monitors</text>
    <rect x="22" y="110" width="126" height="86" rx="10" fill="url(#green)"/>
    <rect x="208" y="110" width="126" height="86" rx="10" fill="url(#orange)"/>
    <path d="M154 153 H 202" stroke="#ffffff" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <g transform="translate(50 268)" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">
      <use href="#key"/><text x="22" y="26">⌃</text>
      <use href="#key" x="52"/><text x="74" y="26">⇧</text>
      <use href="#key" x="104"/><text x="126" y="26">←</text>
      <text x="170" y="26" font-weight="400" fill-opacity="0.6">or</text>
      <use href="#key" x="192"/><text x="214" y="26">→</text>
    </g>
    <text x="178" y="328" text-anchor="middle" font-size="14" fill="#c9d3ff" fill-opacity="0.7">left Control + Shift</text>
  </g>

  <g transform="translate(804 32)">
    <rect width="356" height="336" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="178" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Workspaces</text>
    <rect x="18" y="122" width="96" height="62" rx="8" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="130" y="108" width="96" height="90" rx="10" fill="url(#blue)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="242" y="122" width="96" height="62" rx="8" fill="#ffffff" fill-opacity="0.12"/>
    <text x="66" y="160" text-anchor="middle" font-size="15" fill="#ffffff" fill-opacity="0.6">1</text>
    <text x="178" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="290" y="160" text-anchor="middle" font-size="15" fill="#ffffff" fill-opacity="0.6">3</text>
    <path d="M120 222 H 236" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <g transform="translate(76 268)" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">
      <use href="#key"/><text x="22" y="26">⌃</text>
      <use href="#key" x="52"/><text x="74" y="26">←</text>
      <text x="118" y="26" font-weight="400" fill-opacity="0.6">or</text>
      <use href="#key" x="140"/><text x="162" y="26">→</text>
    </g>
    <text x="178" y="328" text-anchor="middle" font-size="14" fill="#c9d3ff" fill-opacity="0.7">built into macOS</text>
  </g>
</svg>
